<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>粉笔小闯关 · 五年级小数乘法</title>
<!-- 页面自己的报错记在这里，浏览器自检会读它（tools/browser-check.html） -->
<script>window.__bbErrors=[];window.addEventListener("error",function(e){window.__bbErrors.push((e.message||"脚本报错")+" @"+String(e.filename||"").split("/").pop()+":"+(e.lineno||0));});window.addEventListener("unhandledrejection",function(e){window.__bbErrors.push("未处理的 Promise："+((e.reason&&e.reason.message)||e.reason));});</script>
<meta name="description" content="跟着粉笔一笔一笔写竖式，八关闯关学会人教版五年级上册的小数乘法。">
<link rel="stylesheet" href="./css/blackboard.css?v=5">
</head>
<body class="bb">

<header class="bb-head">
  <div class="bb-brand">
    <h1>粉笔小闯关</h1>
    <span class="bb-sub" id="brandSub">五年级上册 · 第 1 单元 小数乘法</span>
  </div>
  <nav class="bb-switch" id="topicSwitch" aria-label="切换专题"></nav>
  <span class="bb-chip" id="brandChip">人教版</span>
</header>

<main class="bb-wrap">

  <!-- 黑板：写一段欢迎与玩法（内容跟着专题走） -->
  <div class="bb-frame">
    <div class="bb-board" id="boardHost" role="group" aria-label="黑板：欢迎与玩法说明"></div>
    <div class="bb-tray">
      <span class="bb-stick"></span>
      <span class="bb-stick y"></span>
      <span class="bb-stick g"></span>
      <span class="bb-eraser"></span>
    </div>
  </div>

  <div class="bb-bar">
    <a class="bb-btn primary" id="resumeBtn" href="./level.html?no=1">从第 1 关开始</a>
    <div class="bb-progress" id="mapProgress" role="img" aria-label="通关进度"></div>
    <span class="bb-score" id="mapProgressLabel">已通关 0 / 8 关</span>
    <button class="bb-btn ghost" id="clearBtn" type="button">清空进度</button>
  </div>

  <div class="bb-bar" style="margin-top:20px">
    <span class="bb-caption" style="flex:1;border-left-color:var(--good);margin:0">
      <span class="bb-c-text" style="font-size:16px">先看黑板讲解，再做这一关的练习；答对 8 成以上才算通关。</span>
    </span>
  </div>

  <!-- 关卡地图 -->
  <nav class="bb-map" id="mapGrid" aria-label="关卡列表"></nav>

  <!-- 底部三张说明卡（内容跟着专题走） -->
  <section class="bb-summary" id="mapSummary"></section>

</main>

<footer class="bb-foot" id="pageFoot">
  依据人教版五年级上册编写 · 所有题目答案都由算式重新核算过
</footer>

<script src="./lib/handwrite.js?v=5"></script>
<script src="./js/bb-core.js?v=5"></script>
<script src="./js/bb-div.js?v=5"></script>
<script src="./js/bb-chalk.js?v=5"></script>
<script src="./js/bb-levels.js?v=5"></script>
<script src="./js/bb-levels-div.js?v=5"></script>
<script src="./js/bb-topics.js?v=5"></script>
<script src="./js/bb-app.js?v=5"></script>
<script>
(function () {
  "use strict";
  var topics = window.BBTopics;
  var topic = topics.current();
  topics.remember(topic.id);

  var host = document.getElementById("boardHost");
  var board = new window.Chalk.Board(host, { reduceMotion: window.BBApp.prefersReducedMotion() });
  board.load(topics.steps(topic));

  /* 系统开了「减少动效」时，板书是直接整块写好的；这时不要自动往下翻，
     否则屏幕上看不出变化，会让人以为内容丢了。 */
  var reduced = window.BBApp.prefersReducedMotion();
  board.on("done", function (e) {
    if (!reduced && e.index < 1) { setTimeout(function () { board.next(); }, 900); }
  });
  board.goto(0);

  window.BBApp.renderTopicBits();
  window.BBApp.renderMap();
})();
</script>
</body>
</html>
